# No host rule: the app is reached through the Traefik load balancer's DNS name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockflow
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockflow-backend
                port:
                  name: http
          # FastAPI's Swagger UI, for the live API demo.
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: stockflow-backend
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: stockflow-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockflow-frontend
                port:
                  name: http
