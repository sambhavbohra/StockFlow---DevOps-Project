# Grafana dashboard, loaded automatically by the Grafana sidecar (label grafana_dashboard=1).
# Panels: request rate, latency p50/p95, error rate, backend CPU, HPA replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stockflow-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  stockflow.json: |
    {
      "uid": "stockflow",
      "title": "StockFlow",
      "tags": [
        "stockflow"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second, by endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (handler) (rate(http_requests_total{job=\"stockflow-backend\", handler!~\"/health|/ready|/metrics\"}[1m]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latency (seconds)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"stockflow-backend\", handler!~\"/health|/ready|/metrics\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"stockflow-backend\", handler!~\"/health|/ready|/metrics\"}[5m])))",
              "legendFormat": "p50"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate (% of requests)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "100 * sum by (status) (rate(http_requests_total{job=\"stockflow-backend\", handler!~\"/health|/ready|/metrics\", status=~\"4xx|5xx\"}[5m])) / scalar(sum(rate(http_requests_total{job=\"stockflow-backend\", handler!~\"/health|/ready|/metrics\"}[5m])))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backend CPU per pod (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"stockflow\", container=\"backend\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend replicas (HPA)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"stockflow\", horizontalpodautoscaler=\"stockflow-backend\"}",
              "legendFormat": "current"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"stockflow\", horizontalpodautoscaler=\"stockflow-backend\"}",
              "legendFormat": "max"
            }
          ]
        }
      ]
    }
