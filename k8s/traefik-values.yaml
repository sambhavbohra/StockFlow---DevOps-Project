# Values for the Traefik Helm chart (the Ingress controller).
# Exposed as NodePort 30080 on the worker nodes' public IPs: this AWS account is not allowed to create
# load balancers ("OperationNotPermitted", Free plan). terraform/eks.tf opens that one port.
# If AWS lifts the restriction, use `type: LoadBalancer` (with the NLB annotation) and drop the nodePort.
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080 # http://<node-public-ip>:30080
  websecure:
    expose:
      default: false # no domain or TLS certificate in this project: HTTP only

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi
