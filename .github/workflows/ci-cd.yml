name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; later jobs (image push, deploy) request more only where needed.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags are mutable; see the March 2026
# trivy-action tag hijack). The comment after each SHA is the release it corresponds to.
jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_DB: stockflow_test
          # Throwaway database that only exists inside this job, so no password is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockflow@localhost:5432/stockflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest (a failing test fails the pipeline)
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  build-scan-push:
    name: Build, scan (Trivy) and publish images
    # Quality gate: no image is built, scanned or published unless both test jobs passed.
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN (no personal access token)
    env:
      # Trivy comes from an immutable GitHub release, verified against this checksum before it runs.
      # Not trivy-action / Docker images: both were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image names (tagged with the commit SHA, never "latest")
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/stockflow-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/stockflow-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        id: build-backend
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$BACKEND_IMAGE" backend

      - name: Build frontend image
        id: build-frontend
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$FRONTEND_IMAGE" frontend

      - name: Install Trivy (checksum-verified)
        run: |
          curl -sSfLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      # Fails on HIGH/CRITICAL CVEs that have a fix available. Unfixed ones are reported by
      # Trivy's database but can't be patched yet, so they don't block a release.
      - name: Trivy scan - backend image
        run: trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$BACKEND_IMAGE"

      - name: Trivy scan - frontend image
        # Scan the frontend even if the backend scan failed, so the log always shows both results.
        if: ${{ !cancelled() && steps.build-frontend.outcome == 'success' }}
        run: trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$FRONTEND_IMAGE"

      - name: Log in to GHCR
        if: ${{ success() && github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push images to GHCR
        if: ${{ success() && github.event_name == 'push' }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          {
            echo "### Published images"
            echo "- \`${BACKEND_IMAGE}\`"
            echo "- \`${FRONTEND_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
